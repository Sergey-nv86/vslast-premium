name: vslast_premium
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  yandex_mapkit: ^4.2.0
  geolocator: ^11.0.0
  http: ^1.2.0
  image_picker: ^1.1.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  # Иконка приложения (не логотип целиком — тот перегружен мелким текстом
  # для маленьких размеров; здесь только эмблема хлеба, вырезанная и
  # пересобранная на фирменном фоне, см. assets/icons/app_icon_source.png).
  # Перегенерировать под все платформы после смены исходника:
  #   flutter pub get && dart run flutter_launcher_icons
  image_path: "assets/icons/app_icon_source.png"
  android: true
  ios: true
  web:
    generate: true
    background_color: "#2E1C12"
    theme_color: "#2E1C12"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: GreatVibes
      fonts:
        - asset: assets/fonts/GreatVibes-Regular.ttf
