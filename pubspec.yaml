name: vslast_premium
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  url_launcher: ^6.3.2
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  yandex_mapkit: ^4.2.0
  geolocator: ^11.0.0
  http: ^1.2.0
  image_picker: ^1.1.2
  web: ^1.1.1
  supabase_flutter: ^2.17.2
  file_picker: ^8.1.7
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  cached_network_image: ^3.4.1
  firebase_core: ^4.14.0
  firebase_messaging: 16.6.0
 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: GreatVibes
      fonts:
        - asset: assets/fonts/GreatVibes-Regular.ttf
