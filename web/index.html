<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta
    name="description"
    content="Всласть — премиальная пекарня-кондитерская"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Всласть">
  <meta name="theme-color" content="#2E1C12">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Всласть</title>
  <link rel="manifest" href="manifest.json">

  <!-- Yandex Maps JavaScript API -->
  <script
    src="https://api-maps.yandex.ru/2.1/?apikey=f1052ecf-4d78-454c-a175-b31bbf3da8a5&lang=ru_RU"
    type="text/javascript">
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #flutter_target {
      width: 100%;
      height: 100%;
    }

    #vslast-yandex-map {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #f5f1eb;
    }

    #vslast-yandex-map .map-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f1eb;
      color: #6f6258;
      font-family: Arial, sans-serif;
      font-size: 15px;
      z-index: 10;
    }
  </style>
</head>

<body>
  <div id="flutter_target"></div>

  <script>
    window.vslastYandexMapsReady = false;

    window.vslastYandexMapsPromise = new Promise(function(resolve) {
      if (typeof ymaps !== 'undefined') {
        ymaps.ready(function() {
          window.vslastYandexMapsReady = true;
          resolve();
        });
        return;
      }

      var timer = setInterval(function() {
        if (typeof ymaps !== 'undefined') {
          clearInterval(timer);

          ymaps.ready(function() {
            window.vslastYandexMapsReady = true;
            resolve();
          });
        }
      }, 100);
    });
  </script>

  <script src="vslast_yandex_map.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
