
[functions.push-dispatcher]
enabled = true
verify_jwt = false
import_map = "./functions/push-dispatcher/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/push-dispatcher/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static files for your function:
# static_files = [ "./functions/push-dispatcher/*.html" ]

[functions.client-auth]
enabled = true
verify_jwt = false
import_map = "./functions/client-auth/deno.json"
entrypoint = "./functions/client-auth/index.ts"
